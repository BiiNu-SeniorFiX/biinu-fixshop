<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BiiNu FixShop - ระบบจัดการงานซ่อมมือถือ</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BiiNu FixShop">
<link rel="apple-touch-icon" href="image.png">
<link rel="icon" type="image/png" href="image.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--mat:#dce4df;--grid:#c9d4cd;--panel:#f4f7f5;--ink:#1e2420;--mut:#566159;--line:#b4c0b8;--tag:#f0e2bc;--tk:#2a2417;--acc:#e63946;--accink:#ffffff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--mat:#18211f;--grid:#222e2a;--panel:#212c29;--ink:#e7eeea;--mut:#9aa8a1;--line:#35453f;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);background-color:var(--mat);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;font:400 16px/1.55 'Sarabun','Leelawadee UI',Tahoma,sans-serif}
h1,h2,.no,.pr,.go,.stamp,.strip b,.btn{font-family:'Chakra Petch','Leelawadee UI',Tahoma,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:22px 16px 40px}
.header-brand{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.header-brand img{width:50px;height:50px;object-fit:cover;border-radius:10px;border:2px solid var(--line)}
h1{margin:0;font-size:26px;font-weight:700;letter-spacing:.01em}
.wrap>p{margin:4px 0 0;max-width:60ch;color:var(--mut);font-size:14px}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-top:16px}
.strip div{background:var(--panel);padding:10px 14px;font-size:13px;color:var(--mut)}
.strip b{display:block;font-size:22px;font-weight:600;line-height:1.25;color:var(--ink);font-variant-numeric:tabular-nums}
.main{display:grid;grid-template-columns:320px 1fr;gap:22px;margin-top:20px;align-items:start}
@media(max-width:820px){.main{grid-template-columns:1fr}}
.pad{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px 16px 18px}
h2{margin:0 0 4px;font-size:18px;font-weight:600}
label{display:block;margin-top:10px;font-size:13px;color:var(--mut)}
input,textarea{width:100%;font:inherit;color:var(--ink);background:transparent;border:0;border-bottom:1.5px solid var(--line);border-radius:0;padding:5px 0}
input:focus,textarea:focus{outline:0;border-bottom-color:var(--acc)}
textarea{resize:vertical;min-height:45px}
.btn,.go,.print-btn,.wa-btn,.email-btn{font-weight:600;font-size:14px;background:var(--acc);color:var(--accink);border:0;border-radius:4px;cursor:pointer;text-align:center;text-decoration:none;display:inline-block}
.btn{width:100%;margin-top:18px;padding:10px;font-size:16px}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.bar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-bottom:16px}
.bar input{flex:1 1 200px;width:auto}
#fl{display:flex;flex-wrap:wrap;gap:2px}
.f{font:inherit;font-size:14px;color:var(--ink);background:none;border:0;padding:4px 10px;cursor:pointer}
.f.on{font-weight:600;box-shadow:inset 0 -3px 0 var(--acc)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:18px 14px}
.t{--c:#4e5c64;position:relative;color:var(--tk);background:var(--tag);border-radius:20px 20px 6px 6px;padding:34px 16px 14px;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.t::before{content:"";position:absolute;top:11px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--mat);box-shadow:inset 0 1px 2px rgba(0,0,0,.4)}
.k1{--c:#1b5fbf}.k2{--c:#0d6b4b}.k3{--c:#6b5a43}
.no{font-size:14px;font-weight:600;opacity:.75}
.stamp{position:absolute;top:30px;right:12px;font-size:13px;font-weight:600;color:var(--c);border:2px solid var(--c);outline:1px solid var(--c);outline-offset:2px;border-radius:4px;padding:0 7px;transform:rotate(-4deg);white-space:nowrap}
.t h3{margin:6px 0 0;font-size:19px;line-height:1.3}
.t p{margin:2px 0 0}
.who{margin-top:8px!important;font-size:13px;opacity:.85}
.cut{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px;padding-top:10px;border-top:2px dashed rgba(42,36,23,.35);min-height:48px}
.pr{font-size:17px;font-weight:600}
.btn-group{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
.go,.print-btn,.wa-btn,.email-btn{padding:6px 8px;line-height:1.2;font-size:11px}
.print-btn{background:#e0e8e4;color:#1e2420;border:1px solid #b4c0b8}
.wa-btn{background:#25d366;color:#fff}
.email-btn{background:#0077b5;color:#fff}
.em{grid-column:1/-1;margin:0;padding:24px 0;color:var(--mut)}
.loading{text-align:center;padding:20px;color:var(--mut);grid-column:1/-1;}
@media print {
  body * { visibility: hidden; }
  #print-area, #print-area * { visibility: visible; }
  #print-area { position: absolute; left: 0; top: 0; width: 100%; padding: 20px; background: #fff; color: #000; font-size: 14px; }
}
#print-area { display: none; }
</style>
</head>
<body>
<div class="wrap">
<div class="header-brand">
  <img src="image.png" alt="BiiNu FixShop Logo">
  <div>
    <h1>BiiNu FixShop</h1>
    <p>ติดต่อ: 20 5780 5851 | เฟสบุ๊ค: BeNo</p>
  </div>
</div>
<div class="strip">
<div><b id="s0">0</b>งานค้างซ่อม</div>
<div><b id="s1">0</b>ซ่อมเสร็จ รอลูกค้ารับ</div>
<div><b id="s2">0</b>รายรับที่ส่งมอบแล้ว</div>
<div><b id="s3">0</b>ใบงานทั้งหมด</div>
</div>
<div class="main">
<form class="pad" id="frm">
<h2>เปิดใบงานใหม่</h2>
<label for="fn">ชื่อลูกค้า</label><input id="fn" required>
<label for="ft">เบอร์โทรศัพท์</label><input id="ft" type="tel" required>
<label for="fe">อีเมลลูกค้า (สำหรับส่งใบเสร็จ)</label><input id="fe" type="email" placeholder="example@email.com">
<label for="fd">รุ่นเครื่องมือถือ</label><input id="fd" required>
<label for="fi">อาการเสีย</label><input id="fi" required>
<label for="fp">ราคาประเมิน (LAK)</label><input id="fp" type="number" min="0" inputmode="numeric" required>
<label for="fw">เงื่อนไขการรับประกัน</label><textarea id="fw">รับประกันงานซ่อม 30 วัน (ยกเว้นตกน้ำ/จอแตกซ้ำ)</textarea>
<button class="btn" type="submit">บันทึกเปิดใบงาน</button>
</form>
<section>
<div class="bar"><input id="q" placeholder="ค้นหาชื่อ เบอร์ รุ่น หรืออาการ" aria-label="ค้นหาใบงาน"><div id="fl"></div></div>
<div class="list" id="list"><div class="loading">กำลังโหลดข้อมูลจาก Google Drive...</div></div>
</section>
</div>
</div>
<div id="print-area"></div>
<script>
// นำ Web app URL ที่ก๊อปปี้จาก Apps Script มาวางไว้ระหว่างเครื่องหมายคำพูดด้านล่างนี้
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyoU6FAXaGHuHAfRxmvV2xcSVmQqz1JIDjdt9f16ActZDdQmf6RNFXNkzi-vX1kgzfoCQ/exec';

const ST=['รับเครื่อง','กำลังซ่อม','ซ่อมเสร็จ','ส่งมอบแล้ว'];
let jobs=[], flt=-1;
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lkip=n=>Number(n||0).toLocaleString('th-TH') + ' LAK';

async function loadJobs(){
  try{
    const res = await fetch(SCRIPT_URL);
    jobs = await res.json();
    render();
  }catch(e){
    $('list').innerHTML='<p class="em">ไม่สามารถโหลดข้อมูลจาก Google Drive ได้ กรุณาตรวจสอบลิงก์ SCRIPT_URL หรืออินเทอร์เน็ต</p>';
  }
}

function render(){
const q=$('q').value.trim().toLowerCase();
const rows=jobs.filter(j=>(flt<0||Number(j.s)===flt)&&[j.n,j.t,j.m,j.i].join(' ').toLowerCase().includes(q)).sort((a,b)=>b.id-a.id);
$('s0').textContent=jobs.filter(j=>Number(j.s)<2).length;
$('s1').textContent=jobs.filter(j=>Number(j.s)===2).length;
$('s2').textContent=lkip(jobs.filter(j=>Number(j.s)===3).reduce((a,j)=>a+Number(j.p),0));
$('s3').textContent=jobs.length;
$('fl').innerHTML=['ทั้งหมด',...ST].map((l,i)=>`<button class="f${flt===i-1?' on':''}" data-f="${i-1}" type="button">${l}</button>`).join('');
$('list').innerHTML=rows.length?rows.map(j=>`
<article class="t k${j.s}">
<span class="stamp">${ST[j.s]}</span>
<span class="no">#${String(j.id).padStart(4,'0')}</span>
<h3>${esc(j.m)}</h3>
<p><b>อาการ:</b> ${esc(j.i)}</p>
<p class="who"><b>ลูกค้า:</b> ${esc(j.n)}<br><b>โทร:</b> ${esc(j.t)}<br><b>ประกัน:</b> ${esc(j.w||'-')}<br>เปิดใบงาน ${new Date(Number(j.d)).toLocaleDateString('th-TH',{day:'numeric',month:'short'})}</p>
<div class="cut">
<b class="pr">${lkip(j.p)}</b>
<div class="btn-group">
<button class="print-btn" data-p="${j.id}" type="button">พิมพ์</button>
<button class="wa-btn" data-wa="${j.id}" type="button">WhatsApp</button>
${j.email?`<button class="email-btn" data-email="${j.id}" type="button">Email</button>`:''}
${Number(j.s)<3?`<button class="go" data-a="${j.id}" type="button">เลื่อนสถานะ</button>`:''}
</div>
</div>
</article>`).join(''):'<p class="em">ไม่พบใบงานในระบบ</p>';
}

function printJob(id){
const j=jobs.find(x=>x.id==id);
if(!j)return;
$('print-area').innerHTML=`
<div style="font-family:'Sarabun',sans-serif; padding:10px;">
  <h2>BiiNu FixShop - ใบรับซ่อม/ใบเสร็จ</h2>
  <p><b>โทร:</b> 20 5780 5851 | <b>Facebook:</b> BeNo</p>
  <hr>
  <p><b>เลขที่ใบงาน:</b> #${String(j.id).padStart(4,'0')} | <b>วันที่:</b> ${new Date(Number(j.d)).toLocaleString('th-TH')}</p>
  <p><b>ชื่อลูกค้า:</b> ${esc(j.n)} | <b>เบอร์โทร:</b> ${esc(j.t)}</p>
  <p><b>รุ่นเครื่อง:</b> ${esc(j.m)}</p>
  <p><b>อาการเสีย:</b> ${esc(j.i)}</p>
  <p><b>ราคาประเมิน:</b> ${lkip(j.p)}</p>
  <p><b>เงื่อนไขการรับประกัน:</b> ${esc(j.w)}</p>
  <p><b>สถานะปัจจุบัน:</b> ${ST[j.s]}</p>
  <br><br>
  <div style="display:flex; justify-content:space-between; margin-top:30px;">
    <div>ลงชื่อ......................................(ผู้รับซ่อม)</div>
    <div>ลงชื่อ......................................(ลูกค้า)</div>
  </div>
</div>
`;
window.print();
}

function sendWhatsApp(id){
const j=jobs.find(x=>x.id==id);
if(!j)return;
const text = `*BiiNu FixShop* %0Aแจ้งสถานะใบงาน #${String(j.id).padStart(4,'0')}%0Aรุ่น: ${j.m}%0Aอาการ: ${j.i}%0Aราคา: ${lkip(j.p)}%0Aสถานะ: ${ST[j.s]}%0Aประกัน: ${j.w}%0Aติดต่อ: 20 5780 5851 (BeNo)`;
window.open(`https://wa.me/?text=${text}`, '_blank');
}

function sendEmail(id){
const j=jobs.find(x=>x.id==id);
if(!j || !j.email)return;
const subject = encodeURIComponent(`ใบเสร็จ/ใบรับซ่อม BiiNu FixShop #${String(j.id).padStart(4,'0')}`);
const body = encodeURIComponent(`เรียน คุณ ${j.n}\n\nรายละเอียดใบงาน #${String(j.id).padStart(4,'0')}\nรุ่นเครื่อง: ${j.m}\nอาการ: ${j.i}\nราคา: ${lkip(j.p)}\nสถานะ: ${ST[j.s]}\nเงื่อนไขการรับประกัน: ${j.w}\n\nขอบคุณที่ใช้บริการ BiiNu FixShop\nโทร: 20 5780 5851 | Facebook: BeNo`);
window.location.href = `mailto:${j.email}?subject=${subject}&body=${body}`;
}

const $=id=>document.getElementById(id);

document.addEventListener('click', async e=>{
const a=e.target.closest('[data-a]');
if(a){
  const j=jobs.find(x=>x.id==a.dataset.a);
  if(j&&Number(j.s)<3){
    j.s = Number(j.s) + 1;
    render();
    await fetch(SCRIPT_URL, {method:'POST', body: JSON.stringify({action:'updateStatus', id:j.id, s:j.s})});
  }
  return;
}
const p=e.target.closest('[data-p]');
if(p){printJob(p.dataset.p);return}
const wa=e.target.closest('[data-wa]');
if(wa){sendWhatsApp(wa.dataset.wa);return}
const em=e.target.closest('[data-email]');
if(em){sendEmail(em.dataset.email);return}
const f=e.target.closest('[data-f]');
if(f){flt=+f.dataset.f;render();return}
});

$('q').oninput=render;

$('frm').onsubmit=async e=>{
e.preventDefault();
const g=n=>$(n).value.trim();
const nextId = jobs.length > 0 ? Math.max(...jobs.map(j => Number(j.id))) + 1 : 1;
const newJob = {
  action: 'add',
  id: nextId,
  n: g('fn'),
  t: g('ft'),
  email: g('fe'),
  m: g('fd'),
  i: g('fi'),
  p: Number(g('fp'))||0,
  w: g('fw'),
  s: 0,
  d: Date.now()
};

jobs.push(newJob);
e.target.reset();
$('fw').value = 'รับประกันงานซ่อม 30 วัน (ยกเว้นตกน้ำ/จอแตกซ้ำ)';
render();

await fetch(SCRIPT_URL, {method:'POST', body: JSON.stringify(newJob)});
loadJobs();
};

loadJobs();
</script>
</body>
</html>
